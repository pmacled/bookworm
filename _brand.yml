meta:
  name: Bookworm
color:
  palette:
    paper: "#FDFCF7"
    paper-shade: "#F4F1E8"
    ink: "#1A2233"
    ink-muted: "#5B6472"
    ink-blue: "#28406B"
    ink-blue-light: "#E4E9F2"
    pencil-red: "#B02A2A"
    pencil-red-light: "#F7E4E4"
    pencil-amber: "#B8791F"
    pencil-amber-light: "#FBF0DC"
    field-green: "#2E7D32"
    rule-blue: "#C6D2E4"
  foreground: ink
  background: paper
  primary: ink-blue
  secondary: ink-muted
  success: field-green
  warning: pencil-amber
  danger: pencil-red
  light: paper-shade
  dark: ink
typography:
  base: system-ui
  headings:
    family: system-ui
    weight: 600
defaults:
  bootstrap:
    enable-rounded: true
    border-radius: "0.375rem"
